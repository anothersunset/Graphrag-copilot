[project]
name = "graphrag-kg"
version = "0.2.0"
description = "GraphRAG index layer: gleaning extraction, entity resolution, Louvain communities, Personalized PageRank retrieval"
requires-python = ">=3.12"
dependencies = [
    "graphrag-schemas",
    "networkx>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
zh = [
    "jieba>=0.42.1",
]
neo4j = [
    "neo4j>=5.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.uv.sources]
graphrag-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
